<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shayne's Midterm Portfolio</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <hr class="header-divider">

  <main>
    <div class="card-container">
      <figure>
        <img src="pic5.jpeg" alt="Contact Banner Image" class="portfolio-img">
        <figcaption style="text-align: center; font-size: 0.75rem; color: #666; margin-bottom: 10px;">Figure 5.1: Inquiry Form Header</figcaption>
      </figure>

      <h2 class="centered-title">Get In Touch</h2>
      <form action="#" method="POST">
        <fieldset>
          <legend>Send a Message</legend>

          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required minlength="2">
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="2" required minlength="10"></textarea>
          </div>

          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </div>
  </main>

  <hr class="footer-divider">
  <footer>
    <p>&copy; Developed by Shayne | HUMAN-COMPUTER INTERACTION..</p>
  </footer>
</body>
</html>
